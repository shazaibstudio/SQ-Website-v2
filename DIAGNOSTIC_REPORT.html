<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQ Interactive Digital Page - DOM Diagnostic</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background: #0a0a0a;
      color: #e0e0e0;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 { color: #d4af37; margin-bottom: 1rem; }
    h2 { color: #d4af37; margin-top: 2rem; border-bottom: 1px solid #d4af37; padding-bottom: 0.5rem; }
    .section {
      background: #1a1a1a;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border-radius: 8px;
      border-left: 3px solid #d4af37;
    }
    .section-title { font-size: 1.1rem; font-weight: bold; color: #d4af37; }
    .detail { margin-top: 0.5rem; font-size: 0.9rem; line-height: 1.6; }
    .status-ok { color: #4ade80; }
    .status-warning { color: #fbbf24; }
    .status-error { color: #f87171; }
    .code-block {
      background: #0a0a0a;
      border: 1px solid #333;
      padding: 1rem;
      margin: 0.5rem 0;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 0.85rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      border: 1px solid #333;
    }
    th, td {
      padding: 0.75rem;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    th {
      background: #1a1a1a;
      color: #d4af37;
      font-weight: bold;
    }
    .grid-info {
      background: #0a0a0a;
      padding: 1rem;
      border-radius: 4px;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <h1>🔍 SQ Interactive Digital Page — DOM Diagnostic Report</h1>
  <p>This page will analyze the rendered state of the Digital page sections.</p>

  <div id="diagnostics"></div>

  <script>
    async function runDiagnostics() {
      const diagnostics = document.getElementById('diagnostics');
      let html = '';

      // 1. Fetch and parse the Digital page
      html += '<h2>1. Page Load Status</h2>';
      try {
        const response = await fetch('http://localhost:8000/digital/');
        const text = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');
        
        html += `<div class="section">
          <div class="section-title"><span class="status-ok">✓</span> Digital page loaded successfully</div>
          <div class="detail">Status: ${response.status} ${response.statusText}</div>
          <div class="detail">Content-Type: ${response.headers.get('content-type')}</div>
          <div class="detail">Total characters: ${text.length}</div>
        </div>`;

        // 2. Check for sections in HTML
        html += '<h2>2. HTML Structure Analysis</h2>';
        const sections = [
          { selector: '.dg-what-we-build', name: 'What We Build' },
          { selector: '.dg-real-work', name: 'Real Work' },
          { selector: '.dg-how-we-work', name: 'How We Work' },
          { selector: '.dg-pricing', name: 'Pricing' },
          { selector: '.dg-support', name: 'Support' },
          { selector: '.dg-crosslinks', name: 'Crosslinks' },
          { selector: '.dg-final-cta', name: 'Final CTA' }
        ];

        const sectionTable = '<table><tr><th>Section</th><th>Found</th><th>HTML Size (approx)</th><th>Child Elements</th></tr>';
        let foundSections = 0;

        sections.forEach(section => {
          const el = doc.querySelector(section.selector);
          if (el) {
            foundSections++;
            const childCount = el.querySelectorAll('*').length;
            html += `<div class="section">
              <div class="section-title"><span class="status-ok">✓</span> ${section.name}</div>
              <div class="detail">Selector: ${section.selector}</div>
              <div class="detail">Element found: Yes</div>
              <div class="detail">Child elements: ${childCount}</div>
              <div class="detail">CSS classes: ${el.className}</div>
            </div>`;
          } else {
            html += `<div class="section">
              <div class="section-title"><span class="status-error">✗</span> ${section.name}</div>
              <div class="detail">Selector: ${section.selector}</div>
              <div class="detail"><span class="status-error">Element NOT found in HTML</span></div>
            </div>`;
          }
        });

        html += `<div class="section">
          <div class="section-title">Summary: ${foundSections}/${sections.length} sections found</div>
        </div>`;

        // 3. Check for data-reveal elements
        html += '<h2>3. Reveal Animation Elements</h2>';
        const revealEls = doc.querySelectorAll('[data-reveal]');
        html += `<div class="section">
          <div class="section-title">Data-Reveal Elements</div>
          <div class="detail">Total elements with [data-reveal]: <strong>${revealEls.length}</strong></div>
          <div class="detail" style="color: #fbbf24;">Note: These elements will be hidden (opacity: 0) until scroll reveals them</div>
        </div>`;

        // 4. Check CSS files
        html += '<h2>4. CSS Resources</h2>';
        const cssLinks = doc.querySelectorAll('link[rel="stylesheet"]');
        const cssTable = '<table><tr><th>CSS File</th><th>Type</th><th>Status</th></tr>';
        let cssFiles = [];
        cssLinks.forEach(link => {
          const href = link.getAttribute('href');
          const isLocal = !href.startsWith('http');
          const isCritical = href.includes('digital') || href.includes('base') || href.includes('components');
          cssFiles.push({
            href,
            isLocal,
            isCritical
          });
        });

        cssFiles.forEach(css => {
          html += `<div class="section">
            <div class="section-title">${css.href}</div>
            <div class="detail">Local: ${css.isLocal ? 'Yes' : 'No (external)'}</div>
            <div class="detail">Critical: ${css.isCritical ? 'Yes' : 'No'}</div>
          </div>`;
        });

        // 5. Check JavaScript files
        html += '<h2>5. JavaScript Resources</h2>';
        const scriptTags = doc.querySelectorAll('script[src]');
        let jsFiles = [];
        scriptTags.forEach(script => {
          const src = script.getAttribute('src');
          jsFiles.push(src);
        });

        jsFiles.forEach(js => {
          html += `<div class="section">
            <div class="section-title">${js}</div>
            <div class="detail">Type: ${js.includes('analytics') ? 'Analytics' : js.includes('main') ? 'Core Animation' : 'Other'}</div>
          </div>`;
        });

        if (jsFiles.length === 0) {
          html += `<div class="section" style="border-left-color: #f87171;">
            <div class="section-title"><span class="status-error">⚠</span> No external scripts loaded</div>
            <div class="detail">Check if scripts are inline in the HTML</div>
          </div>`;
        }

        // 6. Analysis Summary
        html += '<h2>6. Analysis Summary</h2>';
        html += `<div class="section">
          <div class="section-title">Key Findings</div>
          <div class="detail">
            <strong>Content Status:</strong> All sections are present in HTML ✓<br>
            <strong>Reveal Elements:</strong> ${revealEls.length} elements marked for scroll reveal<br>
            <strong>Critical Issue:</strong> Sections may not render if:<br>
            &nbsp;&nbsp;• JavaScript doesn't load or execute<br>
            &nbsp;&nbsp;• IntersectionObserver fails to trigger<br>
            &nbsp;&nbsp;• CSS media queries collapse layout at certain widths<br>
            <strong>Recommended:</strong> Open the page in browser and use DevTools to inspect:
            <ol>
              <li>Network tab → Check if all CSS/JS loaded (200 status)</li>
              <li>Console → Check for JavaScript errors</li>
              <li>Elements tab → Inspect section elements for opacity/display values</li>
              <li>Responsive Design Mode → Test at different viewports</li>
            </ol>
          </div>
        </div>`;

      } catch (err) {
        html += `<div class="section" style="border-left-color: #f87171;">
          <div class="section-title"><span class="status-error">✗</span> Error fetching page</div>
          <div class="detail">${err.message}</div>
          <div class="detail">Make sure http://localhost:8000 is running</div>
        </div>`;
      }

      diagnostics.innerHTML = html;
    }

    // Run on page load
    window.addEventListener('load', runDiagnostics);
    
    // Also run immediately if DOM is ready
    if (document.readyState !== 'loading') {
      runDiagnostics();
    }
  </script>
</body>
</html>
